<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting agent…</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <h1>Starting Mac agent</h1>
      <p class="sub" id="msg">Installing and launching the background service…</p>
    </main>
    <script>
      (async () => {
        const msg = document.getElementById("msg");
        try {
          const res = await fetch("/api/agent/install-bootstrap", {
            method: "POST",
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Install failed");
          msg.textContent =
            data.message ||
            "Agent installed and starting. Return to Go live — it should continue automatically.";
        } catch (err) {
          msg.textContent =
            err instanceof Error ? err.message : "Could not start the agent.";
          msg.style.color = "#e35d6a";
        }
      })();
    </script>
  </body>
</html>
