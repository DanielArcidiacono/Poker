name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            os: macos-15
          - name: Windows Server 2022
            os: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install agent dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci

      - name: Test
        run: npm test

      - name: Type-check agent
        run: npm run check

      - name: Type-check dashboard
        run: npm --prefix dashboard run check

      - name: Build agent
        run: npm run build

      - name: Build dashboard and distribution archive
        run: npm --prefix dashboard run build

      - name: Validate macOS shell scripts
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n scripts/*.sh

      - name: Smoke-test private macOS runtimes
        if: runner.os == 'macOS'
        shell: bash
        env:
          PROSTAR_APP_ROOT: ${{ runner.temp }}/ProstarRuntimeSmoke
        run: |
          bash scripts/ensure-runtime.sh --with-cloudflared
          "$PROSTAR_APP_ROOT/runtime/bin/node" --version
          "$PROSTAR_APP_ROOT/runtime/bin/cloudflared" --version

      - name: Parse Windows scripts with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)."
          }
          Get-ChildItem -LiteralPath windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join [Environment]::NewLine
              throw "$($_.Name) failed to parse:`n$messages"
            }
          }

      - name: Compile and start the Windows capture worker
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $smoke = @'
          import { createWindowsCaptureBackend } from "./dist/windows-capture.js";

          const backend = createWindowsCaptureBackend({ timeoutMs: 30_000 });
          try {
            await backend.preflight({ jpegQuality: 60, scale: 0.5, maxWidth: 1920 });
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            // GitHub-hosted runners may not expose an interactive desktop. A
            // typed capture error still proves C# initialization and the full
            // production request/response protocol; every other error fails CI.
            if (!message.startsWith("capture_failed: ")) throw error;
          } finally {
            backend.close();
          }
          '@
          $smokePath = Join-Path $PWD ".prostar-windows-smoke-$PID.mjs"
          $utf8 = New-Object System.Text.UTF8Encoding -ArgumentList $false
          [System.IO.File]::WriteAllText($smokePath, $smoke, $utf8)
          try {
            node $smokePath
            if ($LASTEXITCODE -ne 0) { throw "The Windows capture worker smoke test failed." }
          }
          finally {
            Remove-Item -LiteralPath $smokePath -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test private Windows runtimes
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PROSTAR_APP_ROOT = Join-Path $env:RUNNER_TEMP "ProstarRuntimeSmoke"
          & windows\ensure-runtime.ps1 -WithCloudflared
          $runtime = Join-Path $env:PROSTAR_APP_ROOT "runtime"
          $nodeId = (Get-Content -LiteralPath (Join-Path $runtime "node-current.txt") -Raw).Trim()
          $cloudflaredId = (Get-Content -LiteralPath (Join-Path $runtime "cloudflared-current.txt") -Raw).Trim()
          & (Join-Path $runtime "$nodeId\node.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "The private Node.js runtime failed." }
          & (Join-Path $runtime "$cloudflaredId\cloudflared.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "The private cloudflared runtime failed." }
